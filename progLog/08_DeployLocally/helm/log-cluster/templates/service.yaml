apiVersion: v1
kind: Service
metadata:
  name: {{ include "log-cluster.fullname" . }}-headless
  labels:
    {{- include "log-cluster.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: {{ include "log-cluster.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: rpc
      port: {{ .Values.service.rpcPort }}
      targetPort: rpc
    - name: raft
      port: {{ .Values.service.raftPort }}
      targetPort: raft
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
